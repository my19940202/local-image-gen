<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地生图</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f3f3ee; color: #20241f; }
    main { width: min(760px, calc(100% - 32px)); margin: 64px auto; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.04em; }
    .intro { margin: 0 0 32px; color: #626a60; line-height: 1.6; }
    .panel { background: #fff; border: 1px solid #dedfd7; border-radius: 18px; padding: 24px; box-shadow: 0 16px 50px #1f2b190d; }
    label { display: block; margin-bottom: 12px; font-weight: 650; }
    textarea { width: 100%; min-height: 145px; resize: vertical; border: 1px solid #bac1b4; border-radius: 10px; padding: 14px; font: inherit; line-height: 1.5; color: inherit; background: #fff; }
    textarea:focus { outline: 3px solid #d6e9bc; border-color: #517342; }
    .actions { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
    button { border: 0; border-radius: 9px; background: #254a2c; color: #fff; font: inherit; font-weight: 650; padding: 11px 18px; cursor: pointer; }
    button:hover { background: #1b3b22; }
    button:disabled { opacity: .5; cursor: wait; }
    .hint { color: #687166; font-size: .9rem; }
    .result { margin-top: 22px; }
    .status { display: flex; align-items: center; gap: 10px; min-height: 28px; font-weight: 600; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #a0aaa0; }
    .dot.pending { background: #d29932; }
    .dot.running { background: #427ec5; animation: pulse 1.2s infinite; }
    .dot.done { background: #3c8b4b; }
    .dot.failed { background: #c54e4e; }
    @keyframes pulse { 50% { opacity: .35; } }
    .error { color: #a52828; white-space: pre-wrap; overflow-wrap: anywhere; }
    img { display: block; width: 100%; max-width: 640px; height: auto; margin: 20px auto 0; border-radius: 12px; background: #eee; }
    .meta { margin-top: 12px; color: #687166; font-size: .9rem; text-align: center; }
    .download { display: inline-block; margin-top: 10px; color: #254a2c; }
    .history { margin-top: 22px; }
    .history h2 { margin: 0 0 16px; font-size: 1.15rem; letter-spacing: -.02em; }
    .history-list { display: flex; flex-direction: column; gap: 14px; }
    .history-item { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; padding-top: 14px; border-top: 1px solid #ecece6; }
    .history-item:first-child { padding-top: 0; border-top: 0; }
    .thumb { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; background: #eee; }
    a > .thumb { margin: 0; }
    .thumb.placeholder { display: grid; place-items: center; color: #8a9186; font-size: .8rem; border: 1px dashed #d5d8d0; background: #fafaf7; }
    .history-prompt { margin: 0 0 6px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .history-prompt.muted { color: #687166; }
    .history-status { min-height: 0; font-weight: 500; color: #687166; font-size: .9rem; }
    .history-error { margin: 6px 0 0; color: #a52828; font-size: .85rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { margin: 0; color: #687166; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>本地生图</h1>
    <p class="intro">输入画面描述，Codex 会在这台 Mac 上生成一张图片。生成可能需要几分钟，耗时会记在下方的历史记录里。</p>
    <section class="panel">
      <form id="form">
        <label for="prompt">画面描述</label>
        <textarea id="prompt" maxlength="1000" placeholder="例如：一只橘猫坐在窗边，午后的阳光洒在木桌上，水彩插画风格" required></textarea>
        <div class="actions">
          <button id="submit" type="submit">生成图片</button>
          <span class="hint">每次生成一张；输出尺寸由 Codex 决定</span>
        </div>
      </form>
      <div class="result" id="result" hidden>
        <div class="status"><span class="dot" id="dot"></span><span id="status"></span></div>
        <p class="error" id="error" hidden></p>
        <img id="image" alt="生成的图片" hidden>
        <p class="meta" id="meta" hidden></p>
        <a class="download" id="download" download="codex-image.png" hidden>下载 PNG</a>
      </div>
    </section>
    <section class="panel history">
      <h2>历史记录</h2>
      <div class="history-list" id="history-list">
        <p class="empty">正在读取历史记录</p>
      </div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#form');
    const promptInput = document.querySelector('#prompt');
    const submit = document.querySelector('#submit');
    const result = document.querySelector('#result');
    const dot = document.querySelector('#dot');
    const statusText = document.querySelector('#status');
    const errorText = document.querySelector('#error');
    const image = document.querySelector('#image');
    const meta = document.querySelector('#meta');
    const download = document.querySelector('#download');
    const historyList = document.querySelector('#history-list');
    const labels = { pending: '排队中', running: '生成中', done: '已完成', failed: '生成失败' };
    let activeJob = sessionStorage.getItem('imagegen-job-id');
    let currentJob = null;
    let historySignature = '';
    let historyTimer;

    function formatDuration(ms) {
      if (ms == null || Number.isNaN(ms)) return '';
      if (ms < 1000) return `${(ms / 1000).toFixed(1)} 秒`;
      const totalSeconds = Math.round(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours) return `${hours} 小时 ${minutes} 分 ${seconds} 秒`;
      if (minutes) return `${minutes} 分 ${seconds} 秒`;
      return `${seconds} 秒`;
    }

    function formatTime(ms) {
      return new Date(ms).toLocaleString('zh-CN', {
        month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit',
      });
    }

    function timingText(job, now = Date.now()) {
      if (job.status === 'pending') return '排队中';
      if (job.status === 'running') {
        if (!job.started_at) return '生成中';
        return `生成中 · 已用 ${formatDuration(now - job.started_at)}`;
      }
      const label = labels[job.status] || job.status;
      if (job.duration_ms == null) return job.status === 'done' ? `${label} · 未记录耗时` : label;
      return `${label} · 耗时 ${formatDuration(job.duration_ms)}`;
    }

    function extraText(job) {
      const parts = [];
      if (job.width && job.height) parts.push(`${job.width} × ${job.height} 像素`);
      if (job.created_at) parts.push(formatTime(job.created_at));
      return parts.join(' · ');
    }

    function render(job) {
      currentJob = job;
      result.hidden = false;
      dot.className = `dot ${job.status}`;
      if (job.status === 'running' && job.started_at) {
        statusText.textContent = timingText(job);
      } else if (job.status === 'failed' && job.duration_ms != null) {
        statusText.textContent = timingText(job);
      } else {
        statusText.textContent = labels[job.status] || job.status;
      }
      errorText.hidden = !job.error;
      errorText.textContent = job.error || '';
      const done = job.status === 'done' && job.image_url;
      image.hidden = !done;
      meta.hidden = !done;
      download.hidden = !done;
      if (done) {
        image.src = job.image_url;
        download.href = job.image_url;
        const spent = job.duration_ms == null ? ' · 未记录耗时' : ` · 耗时 ${formatDuration(job.duration_ms)}`;
        meta.textContent = `${job.width} × ${job.height} 像素${spent}`;
      } else {
        image.removeAttribute('src');
      }
      submit.disabled = job.status === 'pending' || job.status === 'running';
    }

    function renderHistory(jobs) {
      const signature = jobs.map((job) => [job.id, job.status, job.duration_ms, job.error, job.width, job.height].join(':')).join('|');
      if (signature === historySignature) return;
      historySignature = signature;
      historyList.replaceChildren();
      if (!jobs.length) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = '还没有生成记录';
        historyList.append(empty);
        return;
      }
      for (const job of jobs) {
        const item = document.createElement('article');
        item.className = 'history-item';
        if (job.status === 'done' && job.image_url) {
          const link = document.createElement('a');
          link.href = job.image_url;
          link.target = '_blank';
          link.rel = 'noopener';
          const img = document.createElement('img');
          img.className = 'thumb';
          img.alt = job.prompt || '更早生成的图片';
          img.src = job.image_url;
          link.append(img);
          item.append(link);
        } else {
          const placeholder = document.createElement('div');
          placeholder.className = 'thumb placeholder';
          placeholder.textContent = job.status === 'failed' ? '失败' : job.status === 'running' ? '生成中' : '排队';
          item.append(placeholder);
        }
        const body = document.createElement('div');
        const prompt = document.createElement('p');
        prompt.className = job.prompt ? 'history-prompt' : 'history-prompt muted';
        prompt.textContent = job.prompt || '更早生成的图片';
        const status = document.createElement('div');
        status.className = 'status history-status';
        const statusDot = document.createElement('span');
        statusDot.className = `dot ${job.status}`;
        const statusMeta = document.createElement('span');
        const extra = extraText(job);
        statusMeta.textContent = [timingText(job), extra].filter(Boolean).join(' · ');
        if (job.status === 'running' && job.started_at) {
          statusMeta.dataset.live = '1';
          statusMeta.dataset.started = String(job.started_at);
          statusMeta.dataset.extra = extra;
        }
        status.append(statusDot, statusMeta);
        body.append(prompt, status);
        if (job.error) {
          const error = document.createElement('p');
          error.className = 'history-error';
          error.textContent = job.error;
          body.append(error);
        }
        item.append(body);
        historyList.append(item);
      }
    }

    async function refreshHistory() {
      clearTimeout(historyTimer);
      try {
        const response = await fetch('/api/jobs', { cache: 'no-store' });
        if (!response.ok) throw new Error(`历史记录查询失败（${response.status}）`);
        const data = await response.json();
        const jobs = data.jobs || [];
        renderHistory(jobs);
        if (jobs.some((job) => job.status === 'pending' || job.status === 'running')) {
          historyTimer = setTimeout(refreshHistory, 3000);
        }
      } catch {
        historyTimer = setTimeout(refreshHistory, 5000);
      }
    }

    setInterval(() => {
      for (const el of document.querySelectorAll('[data-live="1"]')) {
        const started = Number(el.dataset.started);
        if (!started) continue;
        const text = [`生成中 · 已用 ${formatDuration(Date.now() - started)}`, el.dataset.extra].filter(Boolean).join(' · ');
        if (el.textContent !== text) el.textContent = text;
      }
      if (currentJob?.status === 'running' && currentJob.started_at) {
        statusText.textContent = timingText(currentJob);
      }
    }, 1000);

    async function poll(id) {
      if (id !== activeJob) return;
      try {
        const response = await fetch(`/api/jobs/${id}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(response.status === 404 ? '任务已失效，请重新提交' : `查询失败（${response.status}）`);
        const job = await response.json();
        if (id !== activeJob) return;
        render(job);
        refreshHistory();
        if (job.status === 'pending' || job.status === 'running') {
          setTimeout(() => poll(id), 3000);
        }
      } catch (error) {
        if (id !== activeJob) return;
        result.hidden = false;
        statusText.textContent = '状态查询暂时失败';
        errorText.textContent = error.message;
        errorText.hidden = false;
        if (error.message === '任务已失效，请重新提交') {
          sessionStorage.removeItem('imagegen-job-id');
          activeJob = null;
          submit.disabled = false;
          return;
        }
        setTimeout(() => poll(id), 5000);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!promptInput.value.trim()) return;
      submit.disabled = true;
      errorText.hidden = true;
      try {
        const response = await fetch('/api/jobs', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ prompt: promptInput.value.trim() }),
        });
        const job = await response.json();
        if (!response.ok) throw new Error(job.error || `提交失败（${response.status}）`);
        activeJob = job.id;
        sessionStorage.setItem('imagegen-job-id', job.id);
        render(job);
        refreshHistory();
        poll(job.id);
      } catch (error) {
        result.hidden = false;
        statusText.textContent = '提交失败';
        errorText.textContent = error.message;
        errorText.hidden = false;
        submit.disabled = false;
      }
    });

    refreshHistory();
    if (activeJob) poll(activeJob);
  </script>
</body>
</html>
